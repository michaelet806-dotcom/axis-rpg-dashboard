let AGENTS={},SELECTED=null,WS_SCENE=null,totalRevenue=0;
function hx(n){'use strict';return '#'+((n>>>0).toString(16).padStart(6,'0'));}
function seed(s){return s.split('').reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0)>>>0;}
function dkey(name){return name.replace(/[^a-zA-Z0-9]/g,'_');}

async function loadLiveAgents(){
  try{
    const r=await fetch(API+'/api/agents',{signal:AbortSignal.timeout(3000)});
    if(!r.ok)return;
    const live=await r.json();
    if(!Array.isArray(live)||!live.length)return;
    live.forEach(a=>{
      const i=EMP.findIndex(e=>e.id===a.id);
      if(i>=0)EMP[i]={...EMP[i],status:a.status||EMP[i].status,current_task:a.current_task||EMP[i].current_task};
    });
  }catch(e){}
}

class BootScene extends Phaser.Scene{
  constructor(){super('Boot');}

  create(){
    this._makeAssets();

  _makeAssets(){

    dk.lineStyle(1,0x5a3f25);dk.strokeRect(0,0,32,24);
    dk.fillStyle(0x2a1c0e);dk.fillRect(1,1,30,4);
    dk.fillStyle(0x1a2535);dk.fillRect(4,7,13,13);
    dk.fillStyle(0x0d3a55,0.8);dk.fillRect(5,8,11,11);
    dk.fillStyle(0x004488,0.25);dk.fillRect(5,8,11,11);
    dk.fillStyle(0x4a3622);dk.fillRect(20,7,9,13);
    dk.lineStyle(1,0x8a7a6a,0.4);
    dk.lineBetween(21,10,28,10);dk.lineBetween(21,13,28,13);dk.lineBetween(21,16,28,16);

    const tg=this.make.graphics({add:false});

    tg.fillStyle(0xffaa00);tg.fillRect(4,3,3,4);
    tg.fillStyle(0xffee88,0.9);tg.fillRect(4,2,2,3);
    tg.generateTexture('torch',8,24);tg.destroy();

    // Window 32×32
    const wg=this.make.graphics({add:false});
    wg.fillStyle(0x1a1008);wg.fillRect(0,0,32,32);
    wg.fillStyle(0x0d1e2e);wg.fillRect(3,3,26,26);
    wg.fillStyle(0x3a5a7a,0.15);wg.fillRect(3,3,26,26);
    wg.lineStyle(2,0x7a5520);wg.strokeRect(0,0,32,32);
    wg.lineStyle(1,0x5a3a10);wg.lineBetween(16,3,16,29);wg.lineBetween(3,16,29,16);
    wg.lineStyle(1,0x88aacc,0.25);wg.lineBetween(5,5,13,13);
    wg.generateTexture('window',32,32);wg.destroy();

    // Rug 64×48
    const rg=this.make.graphics({add:false});
    rg.fillStyle(0x2a1206);rg.fillRect(0,0,64,48);
    rg.lineStyle(2,0xc89600,0.75);rg.strokeRect(2,2,60,44);
    rg.lineStyle(1,0xc89600,0.35);rg.strokeRect(6,6,52,36);
    rg.lineStyle(1,0xc89600,0.18);
    for(let x=14;x<60;x+=12)rg.lineBetween(x,6,x,42);
    for(let y=14;y<42;y+=10)rg.lineBetween(6,y,58,y);
    rg.generateTexture('rug',64,48);rg.destroy();

    // Security rug
    const rs=this.make.graphics({add:false});
    rs.fillStyle(0x0e0000);rs.fillRect(0,0,64,48);
    rs.lineStyle(2,0xff3333,0.5);rs.strokeRect(2,2,60,44);
    rs.lineStyle(1,0xff3333,0.2);rs.strokeRect(6,6,52,36);
    rs.lineStyle(1,0xff3333,0.1);
    for(let x=14;x<60;x+=12)rs.lineBetween(x,6,x,42);
    for(let y=14;y<42;y+=10)rs.lineBetween(6,y,58,y);
    rs.generateTexture('rug_sec',64,48);rs.destroy();

    // Particle dot
    const pg=this.make.graphics({add:false});
    pg.fillStyle(0xffffff);pg.fillRect(0,0,4,4);
    pg.generateTexture('dot',4,4);pg.destroy();

    // Candle glow (radial soft circle)
    const cg=this.make.graphics({add:false});
    cg.fillStyle(0xff8800,0.6);cg.fillCircle(8,8,8);
    cg.fillStyle(0xffcc44,0.4);cg.fillCircle(8,8,5);
    cg.fillStyle(0xffffff,0.3);cg.fillCircle(8,8,2);
    cg.generateTexture('glow_dot',16,16);cg.destroy();

    // Player character — 4 directions × 2 frames
    const dirs=['d','l','r','u'];
    const [sx,sy]=[12,20]; // sprite size
    const pg2=this.make.graphics({add:false});
    dirs.forEach((dir,di)=>{
      for(let f=0;f<2;f++){
        const fx=( di*2+f)*sx;
        const lf=(dir==='l')?1:(dir==='r')?-1:0;
        // Shadow
        pg2.fillStyle(0x000000,0.2);pg2.fillEllipse(fx+6,sy-2,8,3);
        // Body (dark armor like AC)
        pg2.fillStyle(0x1a0e2a);pg2.fillRect(fx+3,8,7,9);
        // Hood/head
        pg2.fillStyle(0x0d0818);pg2.fillRect(fx+2,2,9,8);
        pg2.fillStyle(0xfdf6e3);pg2.fillRect(fx+4,4,5,5); // face
        // Cape
        pg2.fillStyle(0x14082a,0.9);pg2.fillRect(fx+1,10,2,7);pg2.fillRect(fx+10,10,2,7);
        // Legs
        pg2.fillStyle(0x120820);
        const lleg=f===0?0:1, rleg=f===0?0:-1;
        pg2.fillRect(fx+3,16+lleg,3,5);pg2.fillRect(fx+7,16+rleg,3,5);
        // Boots
        pg2.fillStyle(0x0a0510);pg2.fillRect(fx+2,20+lleg,4,3);pg2.fillRect(fx+6,20+rleg,4,3);
        // Gold trim
        pg2.fillStyle(0xc89600,0.8);pg2.fillRect(fx+3,8,7,1);
        // White eagle badge
        pg2.fillStyle(0xffffff,0.35);pg2.fillRect(fx+5,11,3,3);
      }
    });
    pg2.generateTexture('player',dirs.length*2*sx,sy+2);pg2.destroy();
    const ptex=this.textures.get('player');
    dirs.forEach((dir,di)=>{
      for(let f=0;f<2;f++)ptex.add(`${dir}_${f}`,0,(di*2+f)*sx,0,sx,sy+2);
      this.anims.create({key:`p_walk_${dir}`,frames:[{key:'player',frame:`${dir}_0`},{key:'player',frame:`${dir}_1`}],frameRate:6,repeat:-1});
    });
  }

  _makeDeptSheets(){
    const SKINS=[0xFDBCB4,0xF1C27D,0xE0AC69,0xC68642,0x8D5524,0x6B3E26];
    const HAIRS=[0x1A1A1A,0x4A2912,0x8B4513,0xFFD700,0xFF6B6B,0x4A90D9,0x9B59B6,0x2ECC71];

    Object.entries(DEPTS).forEach(([name,d])=>{
      const k='sh_'+dkey(name);
      const ds=seed(name);
      const skin=SKINS[ds%SKINS.length];
      const hair=HAIRS[(ds*7)%HAIRS.length];

      const g=this.make.graphics({add:false});
      for(let f=0;f<4;f++)this._drawFrame(g,f*16,f,skin,hair,d.c);
      g.generateTexture(k,64,26);g.destroy();

      const tex=this.textures.get(k);
      for(let i=0;i<4;i++)tex.add(i,0,i*16,0,16,26);

      this.anims.create({key:'idle_'+k,frames:[{key:k,frame:0},{key:k,frame:1},{key:k,frame:2},{key:k,frame:3}],frameRate:3,repeat:-1});
      this.anims.create({key:'work_'+k,frames:[{key:k,frame:0},{key:k,frame:1},{key:k,frame:2},{key:k,frame:3}],frameRate:7,repeat:-1});
    });
  }

  _drawFrame(g,fx,frame,skin,hair,uni){
    const lf=frame===1?1:frame===3?-1:0;
    const rf=frame===3?1:frame===1?-1:0;
    const la=frame===1?-1:frame===3?1:0;
    const ra=frame===3?-1:frame===1?1:0;
    // Shadow
    g.fillStyle(0x000000,0.18);g.fillEllipse(fx+8,25,10,3);
    // Legs
    g.fillStyle(uni,0.72);
    g.fillRect(fx+3,17+lf,4,7);g.fillRect(fx+9,17+rf,4,7);
    // Boots
    g.fillStyle(0x0e0804);
    g.fillRect(fx+2,23+lf,5,3);g.fillRect(fx+9,23+rf,5,3);
    // Body
    g.fillStyle(uni,0.92);g.fillRect(fx+2,9,12,10);
    // Gold collar trim
    g.fillStyle(0xffd700,0.4);g.fillRect(fx+4,9,8,1);g.fillRect(fx+5,10,6,1);
    // Arms
    g.fillStyle(uni,0.75);
    g.fillRect(fx+0,10+la,3,7);g.fillRect(fx+13,10+ra,3,7);
    // Hands
    g.fillStyle(skin);
    g.fillRect(fx+0,16+la,3,2);g.fillRect(fx+13,16+ra,3,2);
    // Neck
    g.fillStyle(skin);g.fillRect(fx+6,7,4,3);
    // Head
    g.fillStyle(skin);g.fillRect(fx+3,0,10,9);
    // Hair
    g.fillStyle(hair);
    g.fillRect(fx+3,0,10,3);g.fillRect(fx+3,0,2,7);g.fillRect(fx+11,0,2,7);
    // Eyes
    g.fillStyle(0x080818);g.fillRect(fx+5,3,2,2);g.fillRect(fx+9,3,2,2);
    g.fillStyle(0xffffff);g.fillRect(fx+6,3,1,1);g.fillRect(fx+10,3,1,1);
    // Badge
    g.fillStyle(0xffffff,0.22);g.fillRect(fx+6,12,4,3);
    g.fillStyle(0xffd700,0.6);g.fillRect(fx+7,13,2,1);
  }
}

class WorldScene extends Phaser.Scene{
  constructor(){super('World');}

  create(){
    WS_SCENE=this;
    this.agentObjs={};
    this.torchPositions=[];
    this._buildWorld();
    loadLiveAgents().finally(()=>{
      this._spawnAgents();
      this._setupParticles();
      this._setupCamera();
      this._setupInput();
      this._connectSocket();
      this._connectSupabase();
      this._spawnPlayer();
      this._startClock();
      this._updateHUD();
      this._updateQuests();
    });
  }

  _buildWorld(){
    const deptList=Object.entries(DEPTS);

    for(let row=0;row<4;row++){
      for(let col=0;col<4;col++){
        const idx=row*4+col;
        const ox=col*ZONE_W*T, oy=row*ZONE_H*T;
        const ZW=ZONE_W*T, ZH=ZONE_H*T;

        if(idx<deptList.length){
          const [dName,d]=deptList[idx];
          const sec=!!d.isSecure;

          // Floor
          const floor=this.add.graphics().setDepth(0);
          const bgc=Phaser.Display.Color.HexStringToColor(d.bg).color;
          floor.fillStyle(bgc);floor.fillRect(ox,oy,ZW,ZH);
          if(sec){
            // Dark red veins
            floor.lineStyle(1,0x550000,0.6);
            const rng=seed(dName);
            for(let i=0;i<12;i++){
              const x1=ox+((rng*(i+1)*137)%ZW), y1=oy+((rng*(i+2)*113)%ZH);
              const x2=ox+((rng*(i+3)*97)%ZW),  y2=oy+((rng*(i+4)*151)%ZH);
              floor.lineBetween(x1,y1,x2,y2);
            }
          }
          // Stone grid
          floor.lineStyle(1,d.c,sec?0.07:0.04);
          for(let ty=0;ty<=ZONE_H;ty++)floor.lineBetween(ox,oy+ty*T,ox+ZW,oy+ty*T);
          for(let tx=0;tx<=ZONE_W;tx++)floor.lineBetween(ox+tx*T,oy,ox+tx*T,oy+ZH);
          // Brick offset lines
          floor.lineStyle(1,d.c,0.025);
          for(let ty=0;ty<ZONE_H;ty++){
            const off=ty%2===0?T/2:0;
            floor.lineBetween(ox+off,oy+ty*T+T/2,ox+ZW,oy+ty*T+T/2);
          }

          // Zone border
          const bdr=this.add.graphics().setDepth(1);
          bdr.lineStyle(sec?3:2,d.c,sec?0.65:0.3);
          bdr.strokeRect(ox+1,oy+1,ZW-2,ZH-2);
          if(sec){
            bdr.lineStyle(1,0xFF0000,0.2);bdr.strokeRect(ox+5,oy+5,ZW-10,ZH-10);
          }

          // Header bar
          const hdr=this.add.graphics().setDepth(1);
          hdr.fillStyle(d.c,sec?0.22:0.1);hdr.fillRect(ox,oy,ZW,26);
          hdr.lineStyle(1,d.c,0.45);hdr.lineBetween(ox,oy+26,ox+ZW,oy+26);

          // Zone label
          const labelStr=d.icon+' '+dName.toUpperCase()+(sec?' — RESTRICTED ACCESS':'');
          this.add.text(ox+ZW/2,oy+13,labelStr,{
            fontSize:'9px',color:hx(d.c),fontFamily:'Courier New',fontStyle:'bold',
            stroke:'#000000',strokeThickness:3
          }).setOrigin(0.5,0.5).setDepth(2);

          // Security: big watermark
          if(sec){
            this.add.text(ox+ZW/2,oy+ZH/2,'⛔\nKALI\nSECURITY\nLAB',{
              fontSize:'18px',color:'#ff000033',fontFamily:'Courier New',
              fontStyle:'bold',align:'center'
            }).setOrigin(0.5).setDepth(1);
            // Warning stripe bottom
            const wb=this.add.graphics().setDepth(1);
            for(let i=0;i<8;i++){
              wb.fillStyle(i%2===0?0xff0000:0x111111,0.07);
              wb.fillRect(ox+i*(ZW/8),oy+ZH-14,ZW/8,14);
            }
          }

          // Rugs
          const rugKey=sec?'rug_sec':'rug';
          this.add.image(ox+ZW*0.28,oy+ZH*0.55,rugKey).setDepth(1).setAlpha(0.75);
          this.add.image(ox+ZW*0.72,oy+ZH*0.55,rugKey).setDepth(1).setAlpha(0.75);

          // Desks — two rows
          [[ox+52,oy+52],[ox+52+68,oy+52],[ox+52+136,oy+52],
           [ox+52,oy+52+72],[ox+52+68,oy+52+72],[ox+52+136,oy+52+72]]
            .forEach(([dx,dy])=>this.add.image(dx,dy,'desk').setDepth(3).setAlpha(sec?0.7:0.88));

          // Windows at top edge
          [ZW/3,2*ZW/3].forEach(wx=>{
            this.add.image(ox+wx,oy+16,'window').setDepth(2).setAlpha(0.65);
          });

          // Torches at zone corners
          [[ox+18,oy+34],[ox+ZW-18,oy+34],[ox+18,oy+ZH-14],[ox+ZW-18,oy+ZH-14]].forEach(([tx,ty])=>{
            const torchImg=this.add.image(tx,ty,'torch').setDepth(4);
            if(sec)torchImg.setTint(0xff4444);
            this.torchPositions.push({x:tx,y:ty-12,sec});
          });

        } else {
          // Lobby
          const lf=this.add.graphics().setDepth(0);
          lf.fillStyle(0x08060f);lf.fillRect(ox,oy,ZW,ZH);
          lf.lineStyle(1,0xffd700,0.06);
          for(let ty=0;ty<=ZONE_H;ty++)lf.lineBetween(ox,oy+ty*T,ox+ZW,oy+ty*T);
          for(let tx=0;tx<=ZONE_W;tx++)lf.lineBetween(ox+tx*T,oy,ox+tx*T,oy+ZH);
          lf.lineStyle(1,0xffd700,0.04);
          lf.lineBetween(ox,oy,ox+ZW,oy+ZH);lf.lineBetween(ox+ZW,oy,ox,oy+ZH);

          const lb=this.add.graphics().setDepth(1);
          lb.lineStyle(2,0xffd700,0.3);lb.strokeRect(ox+1,oy+1,ZW-2,ZH-2);
          lb.fillStyle(0xffd700,0.08);lb.fillRect(ox,oy,ZW,26);
          lb.lineStyle(1,0xffd700,0.4);lb.lineBetween(ox,oy+26,ox+ZW,oy+26);

          this.add.text(ox+ZW/2,oy+13,'🏛 AXIS HQ — COMMAND LOBBY',{
            fontSize:'9px',color:'#ffd700',fontFamily:'Courier New',fontStyle:'bold',
            stroke:'#000000',strokeThickness:3
          }).setOrigin(0.5,0.5).setDepth(2);

          this.add.image(ox+ZW/2,oy+ZH/2,'rug').setDepth(1).setAlpha(0.9).setTint(0xffd700);
          [[ox+32,oy+38],[ox+ZW-32,oy+38]].forEach(([tx,ty])=>{
            this.add.image(tx,ty,'torch').setDepth(4);
            this.torchPositions.push({x:tx,y:ty-12,sec:false});
          });
        }
      }
    }
    this.physics.world.setBounds(0,0,WW,WH);
  }

  _setupParticles(){
    // Torch flames
    this.torchPositions.forEach(({x,y,sec})=>{
      this.add.particles(x,y,'dot',{
        speed:{min:8,max:22},
        angle:{min:255,max:285},
        scale:{start:0.55,end:0},
        alpha:{start:0.85,end:0},
        lifespan:{min:350,max:750},
        frequency:55,
        tint:sec?[0xff0000,0xff3300,0xff6600]:[0xff5500,0xffaa00,0xffdd55],
        quantity:1,
        gravityY:-15,
        blendMode:'ADD',
      }).setDepth(6);
    });

    // Ambient dust motes scattered across world
    for(let i=0;i<25;i++){
      const ex=100+Math.random()*(WW-200);
      const ey=60+Math.random()*(WH-120);
      this.add.particles(ex,ey,'glow_dot',{
        speed:{min:1,max:5},
        angle:{min:0,max:360},
        scale:{start:0.12,end:0},
        alpha:{start:0.12,end:0},
        lifespan:{min:4000,max:9000},
        frequency:800,
        tint:[0xffd700,0xffffff,0xaaccff,0xffaacc],
        quantity:1,
        blendMode:'ADD',
      }).setDepth(11);
    }
  }

  _spawnAgents(){
    const byDept={};
    EMP.forEach(e=>{(byDept[e.department]=byDept[e.department]||[]).push(e);});
    const deptList=Object.entries(DEPTS);

    Object.entries(byDept).forEach(([dname,emps])=>{
      const di=deptList.findIndex(([n])=>n===dname);
      if(di<0)return;
      const [,d]=deptList[di];
      const col=di%4,row=Math.floor(di/4);
      const ox=col*ZONE_W*T+24,oy=row*ZONE_H*T+34;
      emps.forEach((emp,i)=>{
        const gx=i%5,gy=Math.floor(i/5);
        const px=ox+gx*64+32,py=oy+gy*60+38;
        this._createCharacter(emp,d,px,py);
      });
    });
  }

  _createCharacter(emp,d,px,py){
    const k='sh_'+dkey(emp.department);
    if(!this.textures.exists(k))return;

    const sprite=this.add.sprite(px,py,k,0)
      .setDepth(5).setInteractive({useHandCursor:true}).setScale(2);
    sprite.play('idle_'+k);

    // Glow drawn in local space, positioned at world coords
    const glow=this.add.graphics().setPosition(px,py-16).setDepth(4);
    this._redrawGlow(glow,emp.status);

    const label=this.add.text(px,py+20,emp.name.split(' ')[0],{
      fontSize:'7px',color:hx(d.c),fontFamily:'Courier New',
      stroke:'#000000',strokeThickness:2
    }).setOrigin(0.5,0).setDepth(6).setAlpha(0.9);

    const ao={emp,sprite,glow,label,px,py,d,
      phase:Math.random()*Math.PI*2,
      level:1+Math.floor(seed(emp.id)%30),
      xp:Math.floor((seed(emp.id)*13)%1000)
    };

    sprite.on('pointerdown',()=>selectAgent(ao));
    sprite.on('pointerover',()=>{sprite.setTint(0xffffff);label.setAlpha(1);});
    sprite.on('pointerout',()=>{this._applyTint(ao);label.setAlpha(0.9);});

    this._applyTint(ao);
    AGENTS[emp.id]=ao;
    this.agentObjs[emp.id]=ao;
  }

  _redrawGlow(g,status){
    g.clear();
    const C={active:0x00ff88,working:0xffd700,blocked:0xff4444,complete:0x4a90d9,idle:0x222244,approval_pending:0xff9900};
    const c=C[status]||C.idle;
    if(status!=='idle'){g.fillStyle(c,0.22);g.fillCircle(0,0,9);}
    g.fillStyle(c,0.85);g.fillCircle(0,0,3);
  }

  _applyTint(a){
    const k='sh_'+dkey(a.emp.department);
    const st=a.emp.status;
    const T={active:0xffee88,working:0xffdd55,blocked:0xff6666,complete:0x88bbff,
             idle:0xffffff,approval_pending:0xffbb66};
    a.sprite.setTint(T[st]||0xffffff);
    if(st==='active'||st==='working'){
      if(!a.sprite.anims.isPlaying||a.sprite.anims.currentAnim?.key!=='work_'+k)a.sprite.play('work_'+k);
    } else if(st==='blocked'){
      a.sprite.stop();a.sprite.setFrame(0);
    } else {
      if(!a.sprite.anims.isPlaying||a.sprite.anims.currentAnim?.key!=='idle_'+k)a.sprite.play('idle_'+k);
    }
  }

  _setupCamera(){
    this.cameras.main.setBounds(0,0,WW,WH);
    this.cameras.main.setZoom(1.5);
    this.cameras.main.centerOn(WW/2,WH/2);
    let drag=false,lx=0,ly=0;
    this.input.on('pointerdown',p=>{drag=true;lx=p.x;ly=p.y;});
    this.input.on('pointermove',p=>{
      if(!drag)return;
      const z=this.cameras.main.zoom;
      this.cameras.main.scrollX-=(p.x-lx)/z;
      this.cameras.main.scrollY-=(p.y-ly)/z;
      lx=p.x;ly=p.y;
    });
    this.input.on('pointerup',()=>drag=false);
    this.input.on('wheel',(_,__,___,dY)=>{
      this.cameras.main.setZoom(Phaser.Math.Clamp(this.cameras.main.zoom-dY*0.001,0.35,4));
    });
  }

  _setupInput(){
    this.cursors=this.input.keyboard.createCursorKeys();
    this.wasd=this.input.keyboard.addKeys('W,A,S,D');
  }

  _connectSocket(){
    try{
      const s=io(API,{transports:['websocket'],timeout:3000,reconnectionAttempts:3});
      s.on('agent:active', d=>this._setStatus(d.agentId,'active',d.task));
      s.on('agent:idle',   d=>this._setStatus(d.agentId,'idle','Waiting for assignment'));
      s.on('agent:blocked',d=>this._setStatus(d.agentId,'blocked',d.reason||'Blocked'));
      s.on('agent:approval',d=>this._setStatus(d.agentId,'approval_pending',d.task));
      s.on('agent:complete',d=>{this._setStatus(d.agentId,'complete',d.task);this._floatText(d.agentId,'+XP',0x4a90d9);});
      s.on('revenue:event',d=>this._showRevenue(d));
    }catch(e){}
  }

  _setStatus(id,status,task){
    const a=AGENTS[id];if(!a)return;
    a.emp.status=status;a.emp.current_task=task||a.emp.current_task;
    this._redrawGlow(a.glow,status);
    this._applyTint(a);
    this._updateHUD();this._updateQuests();
    if(SELECTED&&SELECTED.emp.id===id)openPanel(SELECTED);
  }

  _floatText(id,txt,color){
    const a=AGENTS[id];if(!a)return;
    const t=this.add.text(a.px,a.py-22,txt,{
      fontSize:'11px',color:hx(color),fontFamily:'Courier New',fontStyle:'bold',
      stroke:'#000000',strokeThickness:2
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({targets:t,y:a.py-65,alpha:0,duration:1800,onComplete:()=>t.destroy()});
  }

  _showRevenue(d){
    const amt=parseInt(d.amount)||0;
    totalRevenue+=amt;
    document.getElementById('h-revenue').textContent='$'+totalRevenue.toLocaleString();
    const el=document.getElementById('rev-ticker');
    el.textContent=`💰 +$${d.amount||'??'} — ${d.source||'Revenue event'}`;
    el.style.opacity='1';
    clearTimeout(this._revT);
    this._revT=setTimeout(()=>el.style.opacity='0',4500);
  }

  _updateHUD(){
    const v=Object.values(AGENTS);
    document.getElementById('h-active').textContent  =v.filter(a=>a.emp.status==='active'||a.emp.status==='working').length;
    document.getElementById('h-tasks').textContent   =v.filter(a=>a.emp.current_task!=='Waiting for assignment').length;
    document.getElementById('h-pending').textContent =v.filter(a=>a.emp.status==='approval_pending').length;
    document.getElementById('h-blocked').textContent =v.filter(a=>a.emp.status==='blocked').length;
  }

  _updateQuests(){
    const active=Object.values(AGENTS)
      .filter(a=>a.emp.status!=='idle'&&a.emp.current_task!=='Waiting for assignment').slice(0,6);
    const IC={active:'🟢',working:'🟡',blocked:'🔴',approval_pending:'🟠',complete:'🔵'};
    document.getElementById('ql-list').innerHTML=active.length
      ?active.map(a=>`<div>${IC[a.emp.status]||'⚪'} <b style="color:${hx(a.d.c)}">${a.emp.name}</b>: ${a.emp.current_task.substring(0,34)}…</div>`).join('')
      :'<div style="color:#1a1006">All agents standing by…</div>';
  }

  _startClock(){
    const el=document.getElementById('hud-r');
    const tick=()=>{el.textContent=new Date().toLocaleTimeString()+' — VIDA TECH';};
    tick();setInterval(tick,1000);
  }

  update(time,delta){
    const spd=180;
    if(this.player){
      this.player.setVelocity(0);
      if(this.cursors.left.isDown ||this.wasd.A.isDown){this.player.setVelocityX(-spd);if(this._playerDir!=='l'){this._playerDir='l';this.player.play('p_walk_l');}}
      else if(this.cursors.right.isDown||this.wasd.D.isDown){this.player.setVelocityX(spd);if(this._playerDir!=='r'){this._playerDir='r';this.player.play('p_walk_r');}}
      else if(this.cursors.up.isDown   ||this.wasd.W.isDown){this.player.setVelocityY(-spd);if(this._playerDir!=='u'){this._playerDir='u';this.player.play('p_walk_u');}}
      else if(this.cursors.down.isDown ||this.wasd.S.isDown){this.player.setVelocityY(spd);if(this._playerDir!=='d'){this._playerDir='d';this.player.play('p_walk_d');}}
      else{this.player.setVelocity(0);this.player.stop();}
    } else {
      const cam=this.cameras.main;
      if(this.cursors.left.isDown ||this.wasd.A.isDown)cam.scrollX-=5;
      if(this.cursors.right.isDown||this.wasd.D.isDown)cam.scrollX+=5;
      if(this.cursors.up.isDown   ||this.wasd.W.isDown)cam.scrollY-=5;
      if(this.cursors.down.isDown ||this.wasd.S.isDown)cam.scrollY+=5;
    }

    Object.values(this.agentObjs).forEach(a=>{
      a.phase+=delta*0.0012;
      const bob=Math.sin(a.phase*2)*1.8;
      a.sprite.setY(a.py+bob);
      a.label.setY(a.py+20+bob);
      a.glow.setPosition(a.px,a.py-16+bob);
    });

    this._drawMinimap();
  }

  _drawMinimap(){
    const cv=document.getElementById('mm');if(!cv)return;
    const ctx=cv.getContext('2d');
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#04020c';ctx.fillRect(0,0,W,H);
    const sx=W/WW,sy=H/WH;

    Object.entries(DEPTS).forEach(([,d],i)=>{
      const c=i%4,r=Math.floor(i/4);
      ctx.fillStyle=d.bg;ctx.fillRect(c*(W/4),r*(H/4),W/4,H/4);
      ctx.strokeStyle=hx(d.c);ctx.lineWidth=0.5;
      ctx.strokeRect(c*(W/4),r*(H/4),W/4,H/4);
    });

    const SC={active:'#00ff88',working:'#ffd700',blocked:'#ff4444',idle:'#18102a',approval_pending:'#ff9900',complete:'#4a90d9'};
    Object.values(AGENTS).forEach(a=>{
      ctx.fillStyle=SC[a.emp.status]||'#18102a';
      ctx.fillRect(a.px*sx-1.5,a.py*sy-1.5,3,3);
    });

    const cam=this.cameras.main;
    ctx.strokeStyle='rgba(255,200,60,0.55)';ctx.lineWidth=1;
    ctx.strokeRect(cam.scrollX*sx,cam.scrollY*sy,(cam.width/cam.zoom)*sx,(cam.height/cam.zoom)*sy);
  }
  _spawnPlayer(){
    if(!this.textures.exists('player'))return;
    const cx=WW/2, cy=WH/2;
    this.player=this.physics.add.sprite(cx,cy,'player',0).setDepth(10).setScale(2);
    this.player.play('p_walk_d');
    this.cameras.main.startFollow(this.player,true,0.08,0.08);
    this._playerDir='d';
  }

  _connectSupabase(){
    try{
      const params=new URLSearchParams(location.search);
      const key=params.get('sak');
      if(!key||typeof window.supabase==='undefined')return;
      const client=window.supabase.createClient('https://zvxlqwoyappxrcxaspbs.supabase.co',key);
      client.channel('agent-status').on('postgres_changes',{event:'UPDATE',schema:'public',table:'agents'},payload=>{
        const n=payload.new;
        if(n)this._setStatus(n.id,n.status,n.current_task);
      }).subscribe();
      console.log('[AXIS] Supabase realtime connected');
    }catch(e){console.warn('[AXIS] Supabase realtime unavailable:',e.message);}
  }
}

function closeDlg(){

function _typewriter(id,text,speed){
  clearTimeout(_twT);
  const el=document.getElementById(id);
  el.textContent='';
  let i=0;
  const tick=()=>{
    if(i<text.length){el.textContent+=text[i++];_twT=setTimeout(tick,speed);}
  };
  tick();
}

// AXIS Terminal
let _termOpen=false;
function toggleTerm(){
  _termOpen=!_termOpen;
  document.getElementById('term').classList.toggle('vis',_termOpen);
  if(_termOpen)document.getElementById('term-input').focus();
}
async function termSend(){
  const inp=document.getElementById('term-input');
  const msg=inp.value.trim();
  if(!msg)return;
  const out=document.getElementById('term-out');
  out.innerHTML+=`<div><span style="color:#00aa55">❯ ${msg}</span></div>`;
  inp.value='';
  try{
    const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg}),signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    out.innerHTML+=`<div style="color:#88ffcc">${(d.response||d.reply||JSON.stringify(d)).substring(0,500)}</div>`;
  }catch(e){
    out.innerHTML+=`<div style="color:#ff6666">[AXIS OFFLINE] ${e.message}</div>`;
  }
  out.scrollTop=out.scrollHeight;
}
document.addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T'){if(!e.target.closest('input,textarea')){e.preventDefault();toggleTerm();}}});
document.getElementById('term-input').addEventListener('keydown',e=>{if(e.key==='Enter')termSend();if(e.key==='Escape')toggleTerm();});

async function dispatchAgent(id){
  const task=prompt('⚡ Assign quest to '+id+'\n\nDescribe the task:');
  if(!task)return;
  try{
    await fetch(API+'/api/agents/'+id+'/dispatch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task})});
    if(WS_SCENE)WS_SCENE._setStatus(id,'active',task);
  }catch(e){alert('Dispatch error: '+e.message+'\n(AXIS offline?)');}
}

async function messageAgent(id){
  const msg=prompt('💬 Message to '+id+':');
  if(!msg)return;
  try{await fetch(API+'/api/agents/'+id+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});}catch(e){}
}

mm.width=180;mm.height=135;

const game=new Phaser.Game({
  type:Phaser.AUTO,
  parent:'gc',
  width:window.innerWidth,

  physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}}

window.addEventListener('resize',()=>game.scale.resize(window.innerWidth,window.innerHeight));
