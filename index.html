// ── State ────────────────────────────────────────────────────────────────────
let AGENTS = {}, SELECTED = null, WS_SCENE = null;

// Merge live API agents into EMP array, overriding status/current_task
async function loadLiveAgents() {
  try {
    const res = await fetch(API + '/api/agents', { signal: AbortSignal.timeout(3000) });
    if (!res.ok) return;
    const live = await res.json();
    if (!Array.isArray(live) || !live.length) return;
    // Build lookup from EMP for fallback data
    const empMap = {};
    EMP.forEach(e => empMap[e.id] = e);
    live.forEach(a => {
      const i = EMP.findIndex(e => e.id === a.id);
      if (i >= 0) {
        EMP[i] = { ...EMP[i], status: a.status || EMP[i].status, current_task: a.current_task || EMP[i].current_task };
      }
    });
  } catch(e) { /* AXIS offline — use static fallback */ }
}

function hx(n){ return '#'+((n>>>0).toString(16).padStart(6,'0')); }
function seed(s){ return s.split('').reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0)>>>0; }

// ── BOOT SCENE ───────────────────────────────────────────────────────────────
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }

  create(){
    // generate floor textures per dept
    const dg = this.make.graphics({add:false});
    Object.entries(DEPTS).forEach(([name,d])=>{
      dg.clear();
      const bg = Phaser.Display.Color.HexStringToColor(d.bg).color;
      dg.fillStyle(bg); dg.fillRect(0,0,T,T);
      dg.lineStyle(1,d.c,0.12); dg.strokeRect(0,0,T,T);
      // subtle diagonal pattern for texture
      dg.lineStyle(1,d.c,0.05);
      dg.lineBetween(0,T,T,0);
      dg.generateTexture('fl_'+name.replace(/[^a-z]/gi,'_'),T,T);
    });
    dg.clear();
    dg.fillStyle(0x030308); dg.fillRect(0,0,T,T);
    dg.lineStyle(1,0x0a0a18,0.8); dg.strokeRect(0,0,T,T);
    dg.generateTexture('fl_default',T,T);
    dg.destroy();

    // lobby floor
    const lg = this.make.graphics({add:false});
    lg.fillStyle(0x080812); lg.fillRect(0,0,T,T);
    lg.lineStyle(1,0xffd700,0.08); lg.strokeRect(0,0,T,T);
    lg.lineStyle(1,0xffd700,0.04);
    lg.lineBetween(0,0,T,T); lg.lineBetween(T,0,0,T);
    lg.generateTexture('fl_lobby',T,T);
    lg.destroy();

    this.scene.start('World');
  }
}

// ── WORLD SCENE ──────────────────────────────────────────────────────────────
class WorldScene extends Phaser.Scene {
  constructor(){ super('World'); }

  create(){
    WS_SCENE = this;
    this.agentObjs = {};
    this._buildWorld();
    // Load live agent statuses from AXIS, then spawn
    loadLiveAgents().finally(() => {
      this._spawnAgents();
      this._setupCamera();
      this._setupInput();
      this._connectSocket();
      this._startClock();
      this._updateHUD();
      this._updateQuests();
    });
  }

  _buildWorld(){
    const deptList = Object.entries(DEPTS);
    // Draw all 15 zones + lobby
    for(let row=0;row<4;row++){
      for(let col=0;col<4;col++){
        const idx = row*4+col;
        const ox = col*ZONE_W*T, oy = row*ZONE_H*T;

        if(idx < deptList.length){
          const [dName, dcfg] = deptList[idx];
          const key = 'fl_'+dName.replace(/[^a-z]/gi,'_');
          for(let ty=0;ty<ZONE_H;ty++)
            for(let tx=0;tx<ZONE_W;tx++)
              this.add.image(ox+tx*T+T/2, oy+ty*T+T/2, key).setDepth(0);

          // Zone border
          const b = this.add.graphics().setDepth(1);
          b.lineStyle(2,dcfg.c,0.35); b.strokeRect(ox+1,oy+1,ZONE_W*T-2,ZONE_H*T-2);

          // Zone header bar
          const hbar = this.add.graphics().setDepth(1);
          hbar.fillStyle(dcfg.c,0.12); hbar.fillRect(ox,oy,ZONE_W*T,18);

          // Zone label
          this.add.text(ox+ZONE_W*T/2, oy+9, dcfg.icon+' '+dName.toUpperCase(), {
            fontSize:'8px', color:hx(dcfg.c), fontFamily:'Courier New', fontStyle:'bold'
          }).setOrigin(0.5,0.5).setDepth(2).setAlpha(0.9);
        } else {
          // Lobby
          for(let ty=0;ty<ZONE_H;ty++)
            for(let tx=0;tx<ZONE_W;tx++)
              this.add.image(ox+tx*T+T/2, oy+ty*T+T/2,'fl_lobby').setDepth(0);
          this.add.text(ox+ZONE_W*T/2, oy+9,'🏛 AXIS HQ — LOBBY',{
            fontSize:'8px', color:'#ffd700', fontFamily:'Courier New', fontStyle:'bold'
          }).setOrigin(0.5,0.5).setDepth(2).setAlpha(0.7);
        }
      }
    }

    this.physics.world.setBounds(0,0,WW,WH);
  }

  _spawnAgents(){
    // Sort employees into their department zones
    const byDept = {};
    EMP.forEach(e=>{ (byDept[e.department]=byDept[e.department]||[]).push(e); });

    const deptList = Object.entries(DEPTS);
    Object.entries(byDept).forEach(([dname, emps])=>{
      const di = deptList.findIndex(([n])=>n===dname);
      if(di<0) return;
      const [,dcfg] = deptList[di];
      const col = di%4, row = Math.floor(di/4);
      const ox = col*ZONE_W*T+8, oy = row*ZONE_H*T+22;

      emps.forEach((emp,i)=>{
        const gx = i%5, gy = Math.floor(i/5);
        const px = ox + gx*56 + 28, py = oy + gy*52 + 28;
        this._createCharacter(emp, dcfg, px, py);
      });
    });
  }

  _createCharacter(emp, dcfg, px, py){
    const s = seed(emp.id);
    const skins = [0xFDBCB4,0xF1C27D,0xE0AC69,0xC68642,0x8D5524,0x6B3E26];
    const hairs = [0x1A1A1A,0x4A2912,0x8B4513,0xFFD700,0xFF6B6B,0x4A90D9,0x9B59B6,0x2ECC71];
    const skin = skins[s%skins.length];
    const hair = hairs[(s*7)%hairs.length];
    const uniform = dcfg.c;
    const key = 'ch_'+emp.id;

    if(!this.textures.exists(key)){
      const g = this.make.graphics({add:false});
      const W=16,H=26;
      // Shadow
      g.fillStyle(0x000000,0.25); g.fillEllipse(8,H,12,4);
      // Legs
      g.fillStyle(uniform,0.85); g.fillRect(3,18,4,7); g.fillRect(9,18,4,7);
      // Shoes
      g.fillStyle(0x1a1a1a); g.fillRect(2,23,5,3); g.fillRect(9,23,5,3);
      // Body
      g.fillStyle(uniform,0.95); g.fillRect(2,9,12,11);
      // Collar
      g.fillStyle(0xffffff,0.4); g.fillRect(5,9,6,2);
      // Arms
      g.fillStyle(uniform,0.75); g.fillRect(0,10,3,8); g.fillRect(13,10,3,8);
      // Hands
      g.fillStyle(skin); g.fillRect(0,17,3,2); g.fillRect(13,17,3,2);
      // Neck
      g.fillStyle(skin); g.fillRect(6,7,4,3);
      // Head
      g.fillStyle(skin); g.fillRect(3,0,10,9);
      // Hair
      g.fillStyle(hair);
      g.fillRect(3,0,10,3); g.fillRect(3,0,2,7); g.fillRect(11,0,2,7);
      // Eyes
      g.fillStyle(0x1a1a2e); g.fillRect(5,3,2,2); g.fillRect(9,3,2,2);
      g.fillStyle(0xffffff); g.fillRect(6,3,1,1); g.fillRect(10,3,1,1);
      // Badge
      g.fillStyle(uniform,0.6); g.fillRect(6,12,4,3);
      g.fillStyle(0xffffff,0.5); g.fillRect(7,13,2,1);
      g.generateTexture(key,W,H);
      g.destroy();
    }

    const sprite = this.add.sprite(px,py,key).setDepth(5).setInteractive({useHandCursor:true});

    // Status glow
    const glow = this.add.graphics().setDepth(4);
    this._drawGlow(glow,px,py-15,emp.status);

    // Name
    const label = this.add.text(px,py+14,emp.name.split(' ')[0],{
      fontSize:'7px', color:hx(dcfg.c), fontFamily:'Courier New'
    }).setOrigin(0.5,0).setDepth(6).setAlpha(0.85);

    const agentObj = {emp, sprite, glow, label, px, py, dcfg,
      phase: Math.random()*Math.PI*2, level:1+Math.floor((seed(emp.id)%30)),
      xp:Math.floor((seed(emp.id)*13)%1000)
    };

    sprite.on('pointerdown',()=>selectAgent(agentObj));
    sprite.on('pointerover',()=>{ sprite.setTint(0xffffff); label.setAlpha(1); });
    sprite.on('pointerout', ()=>{ sprite.clearTint(); label.setAlpha(0.85); });

    AGENTS[emp.id] = agentObj;
    this.agentObjs[emp.id] = agentObj;
  }

  _drawGlow(g, x, y, status){
    g.clear();
    const cols = {active:0x00ff88,working:0xffd700,blocked:0xff4444,
                  complete:0x4a90d9,idle:0x333355,approval_pending:0xff9900};
    const c = cols[status]||cols.idle;
    g.fillStyle(c,0.25); g.fillCircle(x,y,6);
    g.fillStyle(c,0.9);  g.fillCircle(x,y,2.5);
  }

  _setupCamera(){
    this.cameras.main.setBounds(0,0,WW,WH);
    this.cameras.main.setZoom(1.6);
    this.cameras.main.centerOn(WW/2,WH/2);

    // Drag pan
    let dragging=false, lastX=0, lastY=0;
    this.input.on('pointerdown', p=>{
      if(p.button===1||(p.button===0 && !p.downElement?.tagName)){
        dragging=true; lastX=p.x; lastY=p.y;
      }
    });
    this.input.on('pointermove', p=>{
      if(!dragging) return;
      const z=this.cameras.main.zoom;
      this.cameras.main.scrollX -= (p.x-lastX)/z;
      this.cameras.main.scrollY -= (p.y-lastY)/z;
      lastX=p.x; lastY=p.y;
    });
    this.input.on('pointerup', ()=>{ dragging=false; });
    this.input.on('wheel', (_,__, ___, dY)=>{
      const z = Phaser.Math.Clamp(this.cameras.main.zoom - dY*0.001, 0.4, 4);
      this.cameras.main.setZoom(z);
    });
  }

  _setupInput(){
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys('W,A,S,D');
  }

  _connectSocket(){
    try {
      const sock = io(API,{transports:['websocket'],timeout:3000,reconnectionAttempts:3});
      sock.on('agent:active', d=>this._setStatus(d.agentId,'active',d.task));
      sock.on('agent:idle',   d=>this._setStatus(d.agentId,'idle','Waiting for assignment'));
      sock.on('agent:blocked',d=>this._setStatus(d.agentId,'blocked',d.reason||'Blocked'));
      sock.on('agent:approval',d=>this._setStatus(d.agentId,'approval_pending',d.task));
      sock.on('agent:complete',d=>{ this._setStatus(d.agentId,'complete',d.task); this._floatText(d.agentId,'+XP',0x4a90d9); });
      sock.on('revenue:event', d=>this._showRevenue(d));
      this._sock = sock;
    } catch(e){}
  }

  _setStatus(id, status, task){
    const a = AGENTS[id]; if(!a) return;
    a.emp.status=status; a.emp.current_task=task||a.emp.current_task;
    this._drawGlow(a.glow,a.px,a.py-15,status);
    this._updateHUD();
    this._updateQuests();
    if(SELECTED && SELECTED.emp.id===id) openPanel(SELECTED);
  }

  _floatText(id, txt, color){
    const a = AGENTS[id]; if(!a) return;
    const t = this.add.text(a.px,a.py-20,txt,{
      fontSize:'11px',color:hx(color),fontFamily:'Courier New',fontStyle:'bold'
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({targets:t,y:a.py-50,alpha:0,duration:1600,onComplete:()=>t.destroy()});
  }

  _showRevenue(d){
    const el = document.getElementById('rev-ticker');
    el.textContent = `💰 +$${d.amount||'??'} — ${d.source||'Revenue event'}`;
    el.style.opacity='1';
    clearTimeout(this._revT);
    this._revT = setTimeout(()=>el.style.opacity='0',4000);
  }

  _updateHUD(){
    const vals = Object.values(AGENTS);
    document.getElementById('h-active').textContent   = vals.filter(a=>a.emp.status==='active'||a.emp.status==='working').length;
    document.getElementById('h-tasks').textContent    = vals.filter(a=>a.emp.current_task!=='Waiting for assignment').length;
    document.getElementById('h-pending').textContent  = vals.filter(a=>a.emp.status==='approval_pending').length;
    document.getElementById('h-blocked').textContent  = vals.filter(a=>a.emp.status==='blocked').length;
  }

  _updateQuests(){
    const active = Object.values(AGENTS)
      .filter(a=>a.emp.status!=='idle' && a.emp.current_task!=='Waiting for assignment')
      .slice(0,6);
    const icons={active:'🟢',working:'🟡',blocked:'🔴',approval_pending:'🟠',complete:'🔵'};
    document.getElementById('ql-list').innerHTML = active.length
      ? active.map(a=>`<div>${icons[a.emp.status]||'⚪'} <b style="color:${hx(a.dcfg.c)}">${a.emp.name}</b>: ${a.emp.current_task.substring(0,35)}…</div>`).join('')
      : '<div style="color:#2a2a4a">All agents standing by…</div>';
  }

  _startClock(){
    const el = document.getElementById('hud-r');
    const t=()=>{ el.textContent=new Date().toLocaleTimeString()+' — VIDA TECH'; };
    t(); setInterval(t,1000);
  }

  update(time,delta){
    const spd=5, cam=this.cameras.main;
    if(this.cursors.left.isDown ||this.wasd.A.isDown) cam.scrollX-=spd;
    if(this.cursors.right.isDown||this.wasd.D.isDown) cam.scrollX+=spd;
    if(this.cursors.up.isDown   ||this.wasd.W.isDown) cam.scrollY-=spd;
    if(this.cursors.down.isDown ||this.wasd.S.isDown) cam.scrollY+=spd;

    Object.values(this.agentObjs).forEach(a=>{
      a.phase += delta*0.0015;
      const bob = Math.sin(a.phase*2)*1.8;
      a.sprite.setY(a.py+bob);
      a.label.setY(a.py+14+bob);
      if(a.emp.status==='active'||a.emp.status==='working')
        a.sprite.setRotation(Math.sin(a.phase*4)*0.06);
      else a.sprite.setRotation(0);
    });

    this._drawMinimap();
  }

  _drawMinimap(){
    const cv=document.getElementById('mm');
    if(!cv) return;
    const ctx=cv.getContext('2d');
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#030308'; ctx.fillRect(0,0,W,H);
    const sx=W/WW, sy=H/WH;

    // Zones
    Object.entries(DEPTS).forEach(([,d],i)=>{
      const c=i%4, r=Math.floor(i/4);
      ctx.fillStyle=d.bg; ctx.fillRect(c*(W/4),r*(H/4),W/4,H/4);
      ctx.strokeStyle=hx(d.c); ctx.lineWidth=0.5;
      ctx.strokeRect(c*(W/4),r*(H/4),W/4,H/4);
    });

    // Agents
    const sc={active:'#00ff88',working:'#ffd700',blocked:'#ff4444',idle:'#1a1a3a',approval_pending:'#ff9900',complete:'#4a90d9'};
    Object.values(AGENTS).forEach(a=>{
      ctx.fillStyle=sc[a.emp.status]||'#1a1a3a';
      ctx.fillRect(a.px*sx-1,a.py*sy-1,2.5,2.5);
    });

    // Viewport
    const cam=this.cameras.main;
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1;
    ctx.strokeRect(cam.scrollX*sx, cam.scrollY*sy,
      (cam.width/cam.zoom)*sx, (cam.height/cam.zoom)*sy);
  }
}

  <div style="color:#4a90d9;font-size:9px;margin-bottom:6px;letter-spacing:1px">⚔ EQUIPPED ABILITIES</div>
  <div>${toolTags||'<span style="color:#333">No tools equipped</span>'}</div>
</div>

${lockTags?`<div style="margin-bottom:10px">
  <div style="color:#ff4444;font-size:9px;margin-bottom:6px;letter-spacing:1px">🔒 APPROVAL GATES</div>
  <div>${lockTags}</div>
</div>`:''}

<div style="margin-bottom:14px">
  <div style="color:#aaa;font-size:9px;margin-bottom:6px;letter-spacing:1px">📖 AGENT LORE</div>
  <div style="color:#555;font-size:10px;line-height:1.6;font-style:italic">"${e.system_prompt.substring(0,180)}…"</div>
</div>

<div style="display:flex;gap:8px">
  <button class="btn-action" onclick="dispatchAgent('${e.id}')" style="background:${dc};color:#000"
    >⚡ DISPATCH QUEST</button>
  <button class="btn-action" onclick="messageAgent('${e.id}')" style="background:transparent;color:${dc};border:1px solid ${dc}"
    >💬 SEND MESSAGE</button>
</div>
`;

  document.getElementById('ap').classList.add('open');
  document.getElementById('mm').classList.add('shifted');
}

function closePanel(){
  document.getElementById('ap').classList.remove('open');
  document.getElementById('mm').classList.remove('shifted');
  SELECTED = null;
}

async function dispatchAgent(id){
  const task = prompt('⚡ Assign quest to '+id+'\n\nDescribe the task:');
  if(!task) return;
  try {
    const r = await fetch(API+'/api/agents/'+id+'/dispatch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({task})
    });
    const data = await r.json();
    if(WS_SCENE) WS_SCENE._setStatus(id,'active',task);
  } catch(e) { alert('Dispatch error: '+e.message+'\n(AXIS Office offline?)'); }
}

async function messageAgent(id){
  const msg = prompt('💬 Message to '+id+':');
  if(!msg) return;
  try {
    await fetch(API+'/api/agents/'+id+'/message', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:msg})
    });
  } catch(e) {}
}

// minimap sizing
const mm = document.getElementById('mm');
mm.width=180; mm.height=135;

// ── PHASER INIT ──────────────────────────────────────────────────────────────
const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'gc',
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#030308',
  scene: [BootScene, WorldScene],
  scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default:'arcade', arcade:{gravity:{y:0},debug:false} }
});

window.addEventListener('resize', ()=>game.scale.resize(window.innerWidth,window.innerHeight));
</script>
